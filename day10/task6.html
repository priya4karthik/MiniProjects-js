<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Real-Time Key Logger</title>
  <style>
    body {
  font-family: Arial, sans-serif;
  background-color: #f5f5f5;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  background: #fff;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
  width: 400px;
  text-align: center;
}

input {
  width: 100%;
  padding: 10px;
  font-size: 16px;
  border: 2px solid #0078d7;
  border-radius: 5px;
  margin-bottom: 20px;
}

#lastKey {
  font-weight: bold;
  color: #0078d7;
}

ul {
  list-style: none;
  padding: 0;
}

li {
  background: #eee;
  margin: 5px 0;
  padding: 8px;
  border-radius: 5px;
}

  </style>
</head>
<body>
  <div class="container">
    <h1>Real-Time Key Logger</h1>
    <input type="text" id="textInput" placeholder="Type something here...">
    <p>Last Key Pressed: <span id="lastKey">None</span></p>
    <h3>All Keys Pressed:</h3>
    <ul id="keyList"></ul>
  </div>

  <script>const textInput = document.getElementById("textInput");
const lastKey = document.getElementById("lastKey");
const keyList = document.getElementById("keyList");

textInput.addEventListener("keydown", (event) => {
  // Show last key pressed
  lastKey.textContent = event.key;

  // Add to list of all keys pressed
  const li = document.createElement("li");
  li.textContent = event.key;
  keyList.appendChild(li);
});
</script>
</body>
</html>
