<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Drag and Drop Box</title>
  <style>
    body {
  font-family: Arial, sans-serif;
  background-color: #f5f5f5;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

.container {
  text-align: center;
}

#dropArea {
  width: 300px;
  height: 200px;
  border: 2px dashed #0078d7;
  border-radius: 10px;
  margin: 20px auto;
  display: flex;
  justify-content: center;
  align-items: center;
  background-color: #fafafa;
}

#dragBox {
  width: 100px;
  height: 100px;
  background-color: #4CAF50;
  color: white;
  display: flex;
  justify-content: center;
  align-items: center;
  border-radius: 8px;
  cursor: grab;
  margin: 20px auto;
}

#dropArea.over {
  background-color: #d0f0c0;
}

  </style>
</head>
<body>
  <div class="container">
    <h1>Drag and Drop Demo</h1>
    <div id="dropArea">
      <p>Drop the box here</p>
    </div>
    <div id="dragBox" draggable="true">Drag Me</div>
  </div>

  <script> const dragBox = document.getElementById("dragBox");
const dropArea = document.getElementById("dropArea");

// When dragging starts
dragBox.addEventListener("dragstart", (event) => {
  event.dataTransfer.setData("text", event.target.id);
});

// Allow dropping
dropArea.addEventListener("dragover", (event) => {
  event.preventDefault();
  dropArea.classList.add("over");
});

// Remove highlight when leaving
dropArea.addEventListener("dragleave", () => {
  dropArea.classList.remove("over");
});

// Handle drop
dropArea.addEventListener("drop", (event) => {
  event.preventDefault();
  const data = event.dataTransfer.getData("text");
  const draggedElement = document.getElementById(data);
  dropArea.appendChild(draggedElement);
  dropArea.classList.remove("over");
});
</script>
</body>
</html>
