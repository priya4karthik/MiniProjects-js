<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CryptoLive Dashboard</title>
    <style>
        :root {
    --bg: #0f172a;
    --card: #1e293b;
    --text: #f8fafc;
    --green: #10b981;
    --red: #ef4444;
}

body {
    background-color: var(--bg);
    color: var(--text);
    font-family: 'Inter', sans-serif;
    padding: 40px 20px;
}

.container { max-width: 1000px; margin: auto; }

header { text-align: center; margin-bottom: 40px; }

#update-status { color: #94a3b8; font-size: 0.9rem; margin-top: 10px; }

.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
}

.card {
    background: var(--card);
    padding: 20px;
    border-radius: 16px;
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
    transition: transform 0.2s;
}

.card:hover { transform: translateY(-5px); }

.card-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; }

.coin-logo { width: 40px; height: 40px; }

.symbol { color: #94a3b8; font-size: 0.8rem; }

.current-price { font-size: 1.5rem; font-weight: bold; margin-bottom: 5px; }

.change { font-weight: 600; display: flex; align-items: center; gap: 5px; }

.up { color: var(--green); }
.down { color: var(--red); }

.error { grid-column: 1/-1; text-align: center; color: var(--red); }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🚀 CryptoTracker</h1>
            <p id="update-status">Last updated: Just now</p>
        </header>

        <div id="crypto-container" class="grid">
            <p class="loading">Loading market data...</p>
        </div>
    </div>
    <script>
        const cryptoContainer = document.getElementById('crypto-container');
const statusText = document.getElementById('update-status');

async function fetchCryptoData() {
    try {
        const response = await fetch('https://api.coingecko.com/api/v3/coins/markets?vs_currency=usd&order=market_cap_desc&per_page=10&page=1&sparkline=false');
        const data = await response.json();
        
        displayCrypto(data);
        updateTimestamp();
    } catch (error) {
        cryptoContainer.innerHTML = `<p class="error">Rate limit reached. Please wait a moment...</p>`;
    }
}

function displayCrypto(data) {
    cryptoContainer.innerHTML = data.map(coin => {
        // Determine if price change is positive or negative
        const isPositive = coin.price_change_percentage_24h > 0;
        const changeClass = isPositive ? 'up' : 'down';
        const symbol = isPositive ? '▲' : '▼';

        return `
            <div class="card">
                <div class="card-header">
                    <img src="${coin.image}" alt="${coin.name}" class="coin-logo">
                    <div>
                        <h3>${coin.name}</h3>
                        <span class="symbol">${coin.symbol.toUpperCase()}</span>
                    </div>
                </div>
                <div class="price-info">
                    <p class="current-price">$${coin.current_price.toLocaleString()}</p>
                    <p class="change ${changeClass}">
                        ${symbol} ${Math.abs(coin.price_change_percentage_24h).toFixed(2)}%
                    </p>
                </div>
            </div>
        `;
    }).join('');
}

function updateTimestamp() {
    const now = new Date();
    statusText.innerText = `Last updated: ${now.toLocaleTimeString()}`;
}

// Initial fetch
fetchCryptoData();

// Auto-refresh every 60 seconds (60,000 milliseconds)
setInterval(fetchCryptoData, 60000);
    </script>
</body>
</html>
