<!DOCTYPE html>
<html lang="en">
<head>

    <title>Product Catalog</title>
<style>
    /* --- Root Variables for easy theme changes --- */
:root {
    --primary: #4f46e5;
    --secondary: #10b981;
    --dark: #1f2937;
    --light-bg: #f8fafc;
    --white: #ffffff;
    --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background-color: var(--light-bg);
    color: var(--dark);
    line-height: 1.6;
    padding: 2rem;
}

/* --- Header & Controls --- */
header {
    text-align: center;
    margin-bottom: 3rem;
}

h1 {
    font-size: 2.5rem;
    margin-bottom: 1.5rem;
    color: var(--dark);
    font-weight: 800;
}

.controls {
    display: flex;
    justify-content: center;
    gap: 1rem;
    flex-wrap: wrap;
}

button {
    background-color: var(--white);
    border: 1px solid #e2e8f0;
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s ease;
    box-shadow: var(--shadow);
}

button:hover {
    background-color: var(--primary);
    color: white;
    border-color: var(--primary);
    transform: translateY(-2px);
}

/* --- Product Grid --- */
.grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 2rem;
    max-width: 1200px;
    margin: 0 auto;
}

/* --- Product Cards --- */
.product-card {
    background: var(--white);
    padding: 1.5rem;
    border-radius: 16px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    box-shadow: var(--shadow);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    display: flex;
    flex-direction: column;
}

.product-card:hover {
    transform: scale(1.03);
    box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
}

.product-card h3 {
    font-size: 1.25rem;
    margin-bottom: 0.5rem;
}

.category {
    text-transform: uppercase;
    font-size: 0.75rem;
    letter-spacing: 1px;
    color: #64748b;
    font-weight: 700;
    margin-bottom: 1rem;
}

.price {
    font-size: 1.5rem;
    font-weight: 800;
    color: var(--secondary);
    margin-top: auto;
}

/* --- Modal Styling --- */
.modal {
    display: none;
    position: fixed;
    z-index: 1000;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: rgba(15, 23, 42, 0.7); /* Darker backdrop */
    backdrop-filter: blur(4px); /* Blur effect */
    justify-content: center;
    align-items: center;
    padding: 1rem;
}

.modal-content {
    background: var(--white);
    padding: 2.5rem;
    border-radius: 20px;
    width: 100%;
    max-width: 500px;
    position: relative;
    animation: slideIn 0.3s ease-out;
}

@keyframes slideIn {
    from { transform: translateY(20px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
}

.close {
    position: absolute;
    top: 15px;
    right: 20px;
    font-size: 2rem;
    color: #94a3b8;
    cursor: pointer;
}

.close:hover { color: var(--dark); }

#modal-details h2 {
    margin-bottom: 1rem;
    color: var(--primary);
}

#modal-details p {
    margin-bottom: 0.8rem;
    color: #475569;
}
</style>
</head>
<body>
    <header>
        <h1>Mini E-Shop</h1>
        <div class="controls">
            <button onclick="filterByPrice(500)">Under $500</button>
            <button onclick="sortProducts('low-high')">Price: Low to High</button>
            <button onclick="displayProducts(allProducts)">Reset</button>
        </div>
    </header>

    <div id="product-list" class="grid"></div>

    <div id="product-modal" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <span class="close" onclick="closeModal()">&times;</span>
            <div id="modal-details"></div>
        </div>
    </div>

    <script>
        let allProducts = [];

// 1. Fetch Data
async function fetchProducts() {
    try {
        const response = await fetch('products.json');
        allProducts = await response.json();
        displayProducts(allProducts);
    } catch (error) {
        console.error("Error loading products:", error);
    }
}

// 2. Display Products
function displayProducts(products) {
    const container = document.getElementById('product-list');
    container.innerHTML = products.map(product => `
        <div class="product-card" onclick="showDetails(${product.id})">
            <h3>${product.name}</h3>
            <p class="category">${product.category}</p>
            <p class="price">$${product.price}</p>
        </div>
    `).join('');
}

// 3. Filtering
function filterByPrice(limit) {
    const filtered = allProducts.filter(p => p.price < limit);
    displayProducts(filtered);
}

// 4. Sorting
function sortProducts(order) {
    const sorted = [...allProducts].sort((a, b) => a.price - b.price);
    displayProducts(sorted);
}

// 5. Product Details (Modal)
function showDetails(id) {
    const product = allProducts.find(p => p.id === id);
    const modal = document.getElementById('product-modal');
    const content = document.getElementById('modal-details');
    
    content.innerHTML = `
        <h2>${product.name}</h2>
        <p><strong>Category:</strong> ${product.category}</p>
        <p><strong>Price:</strong> $${product.price}</p>
        <p>${product.desc}</p>
    `;
    modal.style.display = "flex";
}

function closeModal() {
    document.getElementById('product-modal').style.display = "none";
}

fetchProducts();
    </script>
</body>
</html>
