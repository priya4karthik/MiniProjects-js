<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Country Explorer</title>
  <style>
    body { font-family: Arial, sans-serif; text-align: center; }
    #country-info { margin-top: 20px; }
    img { width: 150px; }
  </style>
</head>
<body>
  <h1>🌍 Country Explorer</h1>
  
  <!-- Search Bar -->
  <input type="text" id="search" placeholder="Search country..." />
  
  <!-- Dropdown -->
  <select id="country-dropdown"></select>
  
  <!-- Country Info -->
  <div id="country-info"></div>
  
  <script>
    // script.js
const dropdown = document.getElementById("country-dropdown");
const infoDiv = document.getElementById("country-info");
const searchInput = document.getElementById("search");

let countries = [];

// Fetch country data
async function fetchCountries() {
  try {
    const response = await fetch("https://restcountries.com/v3.1/all");
    if (!response.ok) throw new Error("Network response was not ok");
    const data = await response.json();
    console.log(data); // check if data arrives
  } catch (error) {
    console.error("Fetch error:", error);
  }
}
fetchCountries();


// Populate dropdown
function populateDropdown(data) {
  dropdown.innerHTML = "";
  data.forEach(country => {
    const option = document.createElement("option");
    option.value = country.cca2; // country code
    option.textContent = country.name.common;
    dropdown.appendChild(option);
  });
}

// Display selected country info
function displayCountry(code) {
  const country = countries.find(c => c.cca2 === code);
  if (!country) return;
  
  infoDiv.innerHTML = `
    <h2>${country.name.common}</h2>
    <img src="${country.flags.svg}" alt="Flag of ${country.name.common}" />
    <p><strong>Capital:</strong> ${country.capital ? country.capital[0] : "N/A"}</p>
    <p><strong>Region:</strong> ${country.region}</p>
    <p><strong>Population:</strong> ${country.population.toLocaleString()}</p>
  `;
}

// Filter countries by search
searchInput.addEventListener("input", () => {
  const query = searchInput.value.toLowerCase();
  const filtered = countries.filter(c => 
    c.name.common.toLowerCase().includes(query)
  );
  populateDropdown(filtered);
});

// Event listener for dropdown
dropdown.addEventListener("change", () => {
  displayCountry(dropdown.value);
});

// Initialize
fetchCountries();

  </script>
</body>
</html>
