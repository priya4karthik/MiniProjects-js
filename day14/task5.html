<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Dictionary App</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: #333; }
    input, button { padding: 10px; font-size: 16px; margin: 10px 5px; }
    #result { margin-top: 20px; font-size: 18px; }
    .error { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>📖 Dictionary App</h1>
  
  <input type="text" id="word" placeholder="Enter a word">
  <button id="search">Search</button>
  
  <div id="result"></div>
  
  <script>
    document.getElementById("search").addEventListener("click", async () => {
      const word = document.getElementById("word").value.trim();
      const resultBox = document.getElementById("result");
      
      if (!word) {
        resultBox.innerHTML = "<p class='error'>⚠️ Please enter a word.</p>";
        return;
      }
      
      const url = `https://api.dictionaryapi.dev/api/v2/entries/en/${word}`;
      
      try {
        const res = await fetch(url);
        if (!res.ok) throw new Error("Word not found");
        
        const data = await res.json();
        const entry = data[0];
        
        let html = `<p><strong>Word:</strong> ${entry.word}</p>`;
        
        entry.meanings.forEach(meaning => {
          html += `<p><em>${meaning.partOfSpeech}</em></p><ul>`;
          meaning.definitions.forEach(def => {
            html += `<li>${def.definition}`;
            if (def.example) html += ` <br><small>Example: ${def.example}</small>`;
            html += `</li>`;
          });
          html += `</ul>`;
        });
        
        resultBox.innerHTML = html;
      } catch (err) {
        resultBox.innerHTML = `<p class='error'>❌ Word not found.</p>`;
      }
    });
  </script>
</body>
</html>
