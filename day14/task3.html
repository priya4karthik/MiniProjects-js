<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>GitHub User Finder</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: #333; }
    input, button { padding: 10px; font-size: 16px; margin: 10px 0; }
    #result { margin-top: 20px; font-size: 18px; }
    img { border-radius: 50%; width: 120px; height: 120px; }
    .error { color: red; font-weight: bold; }
  </style>
</head>
<body>
  <h1>🔍 GitHub User Finder</h1>
  
  <input type="text" id="username" placeholder="Enter GitHub username">
  <button id="search">Search</button>
  
  <div id="result"></div>
  
  <script>
    document.getElementById("search").addEventListener("click", async () => {
      const username = document.getElementById("username").value.trim();
      const resultBox = document.getElementById("result");
      
      if (!username) {
        resultBox.innerHTML = "<p class='error'>⚠️ Please enter a username.</p>";
        return;
      }
      
      const url = `https://api.github.com/users/${username}`;
      
      try {
        const res = await fetch(url);
        
        if (!res.ok) {
          throw new Error("User not found");
        }
        
        const data = await res.json();
        
        resultBox.innerHTML = `
          <img src="${data.avatar_url}" alt="Profile Image"><br>
          <p><strong>Name:</strong> ${data.name || "N/A"}</p>
          <p><strong>Bio:</strong> ${data.bio || "No bio available"}</p>
          <p><strong>Public Repos:</strong> ${data.public_repos}</p>
          <p><strong>Followers:</strong> ${data.followers}</p>
          <p><a href="${data.html_url}" target="_blank">View Profile</a></p>
        `;
      } catch (err) {
        resultBox.innerHTML = `<p class='error'>❌ User not found.</p>`;
      }
    });
  </script>
</body>
</html>
