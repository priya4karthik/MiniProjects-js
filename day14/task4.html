<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Currency Converter (Frankfurter API)</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 20px; }
    h1 { color: #333; }
    select, input, button { padding: 10px; font-size: 16px; margin: 10px 5px; }
    #result { margin-top: 20px; font-size: 18px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>💱 Currency Converter</h1>
  
  <input type="number" id="amount" placeholder="Enter amount" step="0.01">
  
  <select id="from">
    <option value="USD">USD</option>
    <option value="INR">INR</option>
    <option value="EUR">EUR</option>
    <option value="GBP">GBP</option>
    <option value="JPY">JPY</option>
  </select>
  
  <select id="to">
    <option value="INR">INR</option>
    <option value="USD">USD</option>
    <option value="EUR">EUR</option>
    <option value="GBP">GBP</option>
    <option value="JPY">JPY</option>
  </select>
  
  <button id="convert">Convert</button>
  
  <div id="result"></div>
  
  <script>
    document.getElementById("convert").addEventListener("click", async () => {
      const amount = document.getElementById("amount").value;
      const from = document.getElementById("from").value;
      const to = document.getElementById("to").value;
      const resultBox = document.getElementById("result");
      
      if (!amount || amount <= 0) {
        resultBox.textContent = "⚠️ Please enter a valid amount.";
        return;
      }
      
      const url = `https://api.frankfurter.app/latest?amount=${amount}&from=${from}&to=${to}`;
      
      try {
        const res = await fetch(url);
        const data = await res.json();
        
        if (!data.rates || !data.rates[to]) throw new Error("Conversion failed");
        
        resultBox.textContent = `${amount} ${from} = ${data.rates[to].toFixed(2)} ${to}`;
      } catch (err) {
        resultBox.textContent = "❌ Could not fetch exchange rate.";
      }
    });
  </script>
</body>
</html>
