<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Library Book Management System</title>
  <style>
    body {
  font-family: Arial, sans-serif;
  background-color: #f5f5f5;
  display: flex;
  justify-content: center;
  align-items: flex-start;
  min-height: 100vh;
}

.container {
  background: #fff;
  padding: 30px;
  border-radius: 10px;
  box-shadow: 0px 4px 10px rgba(0,0,0,0.2);
  width: 500px;
}

h1, h2 {
  text-align: center;
}

input {
  width: 100%;
  padding: 8px;
  margin: 5px 0;
  border: 2px solid #0078d7;
  border-radius: 5px;
}

button {
  padding: 10px;
  margin: 10px 0;
  width: 100%;
  border: none;
  border-radius: 5px;
  background-color: #0078d7;
  color: white;
  cursor: pointer;
}

button:hover {
  opacity: 0.8;
}

ul {
  list-style: none;
  padding: 0;
}

li {
  background: #eee;
  padding: 10px;
  margin: 5px 0;
  border-radius: 5px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

  </style>
</head>
<body>
  <div class="container">
    <h1>Library Book Management System</h1>

    <!-- Add Book -->
    <h2>Add Book</h2>
    <input type="text" id="bookId" placeholder="Book ID">
    <input type="text" id="bookTitle" placeholder="Title">
    <input type="text" id="bookAuthor" placeholder="Author">
    <input type="text" id="bookGenre" placeholder="Genre">
    <button id="addBookBtn">Add Book</button>

    <!-- Search -->
    <h2>Search Books</h2>
    <input type="text" id="searchInput" placeholder="Search by Title, Author, or Genre">
    <button id="searchBtn">Search</button>
    <ul id="searchResults"></ul>

    <!-- Available Books -->
    <h2>Available Books</h2>
    <ul id="availableBooks"></ul>
  </div>

  <script>
    let library = [];

// DOM Elements
const bookId = document.getElementById("bookId");
const bookTitle = document.getElementById("bookTitle");
const bookAuthor = document.getElementById("bookAuthor");
const bookGenre = document.getElementById("bookGenre");
const addBookBtn = document.getElementById("addBookBtn");
const searchInput = document.getElementById("searchInput");
const searchBtn = document.getElementById("searchBtn");
const searchResults = document.getElementById("searchResults");
const availableBooks = document.getElementById("availableBooks");

// Add Book
addBookBtn.addEventListener("click", () => {
  const book = {
    id: bookId.value,
    title: bookTitle.value,
    author: bookAuthor.value,
    genre: bookGenre.value,
    available: true,
    borrower: null
  };

  if (!book.id || !book.title || !book.author || !book.genre) {
    alert("Please fill all fields!");
    return;
  }

  library.push(book);
  clearInputs();
  renderAvailableBooks();
});

// Search Books
searchBtn.addEventListener("click", () => {
  const query = searchInput.value.toLowerCase();
  searchResults.innerHTML = "";

  const results = library.filter(
    b =>
      b.title.toLowerCase().includes(query) ||
      b.author.toLowerCase().includes(query) ||
      b.genre.toLowerCase().includes(query)
  );

  if (results.length === 0) {
    searchResults.innerHTML = "<li>No books found</li>";
  } else {
    results.forEach(book => {
      const li = document.createElement("li");
      li.textContent = `${book.title} by ${book.author} (${book.genre}) - ${book.available ? "Available" : "Borrowed by " + book.borrower}`;

      // Borrow button
      if (book.available) {
        const borrowBtn = document.createElement("button");
        borrowBtn.textContent = "Borrow";
        borrowBtn.addEventListener("click", () => {
          book.available = false;
          book.borrower = "User"; // In real app, replace with actual user input
          renderAvailableBooks();
          searchBtn.click();
        });
        li.appendChild(borrowBtn);
      } else {
        const returnBtn = document.createElement("button");
        returnBtn.textContent = "Return";
        returnBtn.addEventListener("click", () => {
          book.available = true;
          book.borrower = null;
          renderAvailableBooks();
          searchBtn.click();
        });
        li.appendChild(returnBtn);
      }

      searchResults.appendChild(li);
    });
  }
});

// Render Available Books
function renderAvailableBooks() {
  availableBooks.innerHTML = "";
  const available = library.filter(b => b.available);

  if (available.length === 0) {
    availableBooks.innerHTML = "<li>No books available</li>";
  } else {
    available.forEach(book => {
      const li = document.createElement("li");
      li.textContent = `${book.title} by ${book.author} (${book.genre})`;
      availableBooks.appendChild(li);
    });
  }
}

// Clear Input Fields
function clearInputs() {
  bookId.value = "";
  bookTitle.value = "";
  bookAuthor.value = "";
  bookGenre.value = "";
}

  </script>
</body>
</html>
