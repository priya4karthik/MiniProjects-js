<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Debugging Dashboard</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
  body {
    font-family: Arial, sans-serif;
    background: #f4f6f8;
    padding: 20px;
  }

  .dashboard {
    max-width: 700px;
    margin: auto;
    background: #fff;
    padding: 20px;
    border-radius: 8px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.1);
  }

  h2 {
    text-align: center;
  }

  button {
    padding: 10px 15px;
    margin: 5px 0;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }

  .error-btn {
    background: #e53935;
    color: #fff;
  }

  .clear-btn {
    background: #607d8b;
    color: #fff;
  }

  .log {
    background: #fdecea;
    color: #b71c1c;
    padding: 10px;
    margin: 8px 0;
    border-radius: 5px;
    font-size: 14px;
  }

  .time {
    font-size: 12px;
    color: #555;
  }
</style>
</head>
<body>

<div class="dashboard">
  <h2>🐞 Debugging Dashboard</h2>

  <button class="error-btn" onclick="generateError()">Generate Error</button>
  <button class="clear-btn" onclick="clearLogs()">Clear Logs</button>

  <div id="logs"></div>
</div>

<script>
const STORAGE_KEY = "debugLogs";

// Load logs on page load
window.onload = displayLogs;

// Log error function
function logError(message) {
  console.error(message);

  const logs = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];

  logs.push({
    message: message,
    time: new Date().toLocaleString()
  });

  localStorage.setItem(STORAGE_KEY, JSON.stringify(logs));
  displayLogs();
}

// Display logs
function displayLogs() {
  const logs = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
  const logContainer = document.getElementById("logs");
  logContainer.innerHTML = "";

  if (logs.length === 0) {
    logContainer.innerHTML = "<p>No error logs available.</p>";
    return;
  }

  logs.forEach(log => {
    const div = document.createElement("div");
    div.className = "log";
    div.innerHTML = `
      <strong>Error:</strong> ${log.message}<br>
      <span class="time">${log.time}</span>
    `;
    logContainer.appendChild(div);
  });
}

// Generate sample error
function generateError() {
  try {
    let x = undefinedVariable; // Intentional error
  } catch (error) {
    logError(error.message);
  }
}

// Clear logs
function clearLogs() {
  localStorage.removeItem(STORAGE_KEY);
  displayLogs();
}
</script>

</body>
</html>
